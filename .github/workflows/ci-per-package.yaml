name: CI per package

on:
  - push

jobs:
  tests:
    name: Package tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - oe_bootstrap_theme
          - oe_whitelabel
          - oe_showcase
        php:
          - '8.3'
        drupal-constraint:
          #- '^10.3'
          - '~11.1.0'
          #- '^11.2'
        composer-flags:
          - ''
          #- '--prefer-lowest'

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      # For some reason, file ownership with docker-compose is different in github actions.
      # This causes problems when composer or npm cannot write in the package directory.
      # @todo Do something smarter than chmod 777.
      - name: Set file ownership
        run: |
          set -x
          chmod 777 . || sudo chmod 777 .

      - name: Customize docker-compose.yml
        run: |
          set -x
          # Set the php version in docker-compose.yml.
          sed -i -e 's/httpd-php:8.[0-9]-dev/httpd-php:${{ matrix.php }}-dev/g' docker-compose.yml
          # Report what was changed.
          git diff

      - name: Start docker compose
        run: |
          docker compose -f docker-compose.yml -f ../../shared/docker-compose.package.yml up -d

      - name: Disable xdebug
        run: |
          set -x

          # Report before.
          docker compose exec -T web php --version
          docker compose exec -T web php --info | grep xdebug.mode

          # Disable xdebug.
          docker compose exec -T web phpdismod xdebug
          # Restart the web server.
          docker compose exec -T web /etc/init.d/php${{ matrix.php }}-fpm restart

          # Report after.
          docker compose exec -T web php --version
          docker compose exec -T web php --info | grep xdebug.mode || true

      - name: Set Drupal version in composer.json
        if: hashFiles(format('packages/{0}/composer.mono.lock', matrix.package)) == ''
        run: |
          set -x
          pwd
          ls -lA
          # Require a specific Drupal core version.
          docker compose exec -e COMPOSER=composer.json -T web composer require --no-update \
            drupal/core:${{ matrix.drupal-constraint }} \
            drupal/core-composer-scaffold:${{ matrix.drupal-constraint }} \
            drupal/core-dev:${{ matrix.drupal-constraint }}
          git status
          git add .
          git diff --staged

      - name: Composer install
        run: |
          docker compose exec -T web composer install --no-interaction

      - name: npm install for symlinked oe_bootstrap_theme
        if: hashFiles(format('packages/{0}/build/themes/contrib/oe_bootstrap_theme/package.json', matrix.package)) != ''
        run: |
          set -x
          cd build/themes/contrib/oe_bootstrap_theme
          # Use the node service of the package itself.
          docker compose up -d node
          # Change ownership of ./assets/ only if it exists.
          docker compose exec -u root -T node chown node:node . assets || true
          docker compose exec -u node -T node npm install --unsafe-perm
          docker compose exec -u node -T node npm run build

      - name: npm install for symlinked oe_whitelabel
        if: hashFiles(format('packages/{0}/build/themes/contrib/oe_whitelabel/package.json', matrix.package)) != ''
        run: |
          set -x
          cd build/themes/contrib/oe_whitelabel
          # Use the node service of the package itself.
          docker compose up -d node
          # Change ownership of ./assets/ only if it exists.
          docker compose exec -u root -T node chown node:node . assets || true
          docker compose exec -u node -T node npm install --unsafe-perm
          docker compose exec -u node -T node npm run build

      - name: npm install
        if: hashFiles(format('packages/{0}/package.json', matrix.package)) != ''
        run: |
          set -x
          # Change ownership of ./assets/ only if it exists.
          # @todo Restore ownership later.
          # @todo Find something better than chown.
          docker compose exec -u root -T node chown node:node . assets || true
          docker compose exec -u node -T node npm install --unsafe-perm
          docker compose exec -u node -T node npm run build

      - name: GrumPHP (disabled)
        # GrumPHP does not work well because it needs a .git/ directory.
        # @todo Fix grumphp in github action, or replace it.
        if: false
        run: |
          docker compose exec -T web ./vendor/bin/grumphp run

      - name: Drupal site install (showcase only)
        if: ${{ matrix.package == 'oe_showcase' }}
        run: |
          set -x
          docker compose exec -T web ./vendor/bin/run drupal:site-install
          docker compose exec -T web ./vendor/bin/run ci:site-setup
          docker compose exec -T web ./vendor/bin/drush en -y oe_showcase_test
          docker compose exec -T web ./vendor/bin/drush pmu update

      - name: PhpUnit
        run: |
          docker compose exec -T web ./vendor/bin/phpunit
